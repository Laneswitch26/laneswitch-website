<!doctype html><html lang="de"><meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><title>LANE SWITCH Layoutprüfung</title><style>body{margin:0;font:14px system-ui;background:#ccc}header{padding:8px;display:flex;gap:12px}iframe{display:block;border:0;background:white;height:850px}select,input,button{padding:8px}</style><header><label>Seite <select id="page"></select></label><label>Breite <select id="width"><option>360</option><option>390</option><option>768</option><option>1280</option></select></label><button id="load">Anzeigen</button></header><iframe id="site" title="Prüfansicht"></iframe><script>const paths=["/app-install/", "/", "/konzept/cockpit/", "/konzept/datenschutz/", "/konzept/easi-drive/", "/konzept/fahrschueler/", "/konzept/fahrschueler-informationen/", "/konzept/fahrschul-check/", "/konzept/fahrschulen/", "/konzept/fahrschulen-informationen/", "/konzept/fahrzeugkosten/", "/konzept/impressum/", "/konzept/", "/konzept/kontakt/", "/konzept/kooperationen/fahrschulen/fahrschule-emre/", "/konzept/kooperationen/fahrschulen/", "/konzept/kooperationen/", "/konzept/lernwelt/gefahrenradar/", "/konzept/lernwelt/", "/konzept/notfallcenter/", "/konzept/unfallhelfer/", "/konzept/vorlagen/", "/offline.html"];const page=document.querySelector('#page');paths.forEach(p=>{const o=document.createElement('option');o.value=p;o.textContent=p;page.append(o)});document.querySelector('#load').onclick=()=>{const frame=document.querySelector('#site');frame.style.width=document.querySelector('#width').value+'px';frame.src=page.value};document.querySelector('#load').click();</script></html>
