<!doctype html><html lang="de"><meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><title>LANE SWITCH Layoutprüfung</title><style>body{margin:0;font:14px system-ui;background:#ccc}header{padding:8px;display:flex;gap:12px}iframe{display:block;border:0;background:white;height:850px}select,input,button{padding:8px}</style><header><label>Seite <select id="page"></select></label><label>Breite <select id="width"><option>360</option><option>390</option><option>768</option><option>1280</option></select></label><button id="run">Gesamtlauf starten</button><button id="measure">Aktuelle Ansicht messen</button><button id="theme">Hell / Dunkel</button><button id="load">Anzeigen</button></header><p id="progress" role="status"></p><details><summary>Messwerte</summary><pre id="results"></pre></details><iframe id="site" title="Prüfansicht"></iframe><script>const paths=["/app-install/", "/", "/konzept/cockpit/", "/konzept/datenschutz/", "/konzept/easi-drive/", "/konzept/fahrschueler/", "/konzept/fahrschueler-informationen/", "/konzept/fahrschul-check/", "/konzept/fahrschulen/", "/konzept/fahrschulen-informationen/", "/konzept/fahrzeugkosten/", "/konzept/impressum/", "/konzept/", "/konzept/kontakt/", "/konzept/kooperationen/fahrschulen/fahrschule-emre/", "/konzept/kooperationen/fahrschulen/", "/konzept/kooperationen/", "/konzept/lernwelt/gefahrenradar/", "/konzept/lernwelt/", "/konzept/notfallcenter/", "/konzept/unfallhelfer/", "/konzept/vorlagen/", "/offline.html","/?zielgruppe=school&layout-audit=entdecken#entdecken","/?zielgruppe=school&layout-audit=werkzeuge#werkzeuge","/?zielgruppe=school&layout-audit=netzwerk#netzwerk","/?zielgruppe=school&layout-audit=kontakt#kontakt","/?zielgruppe=learner&layout-audit=entdecken#entdecken","/?zielgruppe=learner&layout-audit=werkzeuge#werkzeuge","/?zielgruppe=learner&layout-audit=netzwerk#netzwerk","/?zielgruppe=learner&layout-audit=kontakt#kontakt"];const page=document.querySelector('#page');paths.forEach(p=>{const o=document.createElement('option');o.value=p;o.textContent=p;page.append(o)});document.querySelector('#load').onclick=()=>{const frame=document.querySelector('#site');frame.style.width=document.querySelector('#width').value+'px';frame.src=page.value};document.querySelector('#load').click();
const measure=(root)=>{const d=root.ownerDocument,w=d.defaultView;const visible=e=>{const r=e.getBoundingClientRect(),s=w.getComputedStyle(e);return r.width>0&&r.height>0&&s.visibility!=='hidden'&&s.display!=='none'&&!e.closest('[hidden]')};const label=e=>({tag:e.tagName,cls:e.className,text:(e.innerText||'').trim().slice(0,70)});const text=[...d.querySelectorAll('main p,main h1,main h2,main h3,main li,main label,main summary,main button')].filter(visible);const narrow=text.filter(e=>e.innerText.trim().length>28&&e.getBoundingClientRect().width<110).map(e=>({...label(e),width:Math.round(e.getBoundingClientRect().width)}));const clipped=text.filter(e=>e.clientWidth>0&&e.scrollWidth>e.clientWidth+3&&w.getComputedStyle(e).overflowX!=='auto').map(label);const outside=[...d.querySelectorAll('main article,main section,main input,main select,main textarea,.topbar,.bottom-nav')].filter(visible).filter(e=>{const r=e.getBoundingClientRect();return r.right>w.innerWidth+2||r.left< -2}).map(label);const rgba=s=>(s.match(/[\d.]+/g)||[]).map(Number);const blend=(a,b)=>{const alpha=a.length>3?a[3]:1;return a.slice(0,3).map((v,i)=>v*alpha+b[i]*(1-alpha))};const lumin=c=>c.slice(0,3).map(v=>{v/=255;return v<=.04045?v/12.92:((v+.055)/1.055)**2.4}).reduce((s,v,i)=>s+v*[.2126,.7152,.0722][i],0);const low=text.filter(e=>!e.querySelector('p,h1,h2,h3,button,label')&&e.innerText.trim()).flatMap(e=>{let ancestors=[],n=e;while(n){ancestors.unshift(n);n=n.parentElement}let bg=[255,255,255];for(const a of ancestors){const c=w.getComputedStyle(a);if(c.backgroundImage!=='none')return [];bg=blend(rgba(c.backgroundColor),bg)}const s=w.getComputedStyle(e),fg=blend(rgba(s.color),bg),a=lumin(fg),b=lumin(bg),ratio=(Math.max(a,b)+.05)/(Math.min(a,b)+.05),large=Number.parseFloat(s.fontSize)>=24||(Number.parseFloat(s.fontSize)>=18.66&&Number.parseInt(s.fontWeight)>=700);return ratio<(large?3:4.5)?[{...label(e),ratio:+ratio.toFixed(2),color:s.color,bg}]:[]});const footer=d.querySelector('.ls-footer'),header=d.querySelector('.topbar'),nav=d.querySelector('.bottom-nav');return {path:w.location.pathname+w.location.search+w.location.hash,width:w.innerWidth,theme:root.dataset.theme||'system',overflow:root.scrollWidth>w.innerWidth+2,narrow,clipped,outside,low,footerHeight:footer?Math.round(footer.getBoundingClientRect().height):null,headerHeight:header?Math.round(header.getBoundingClientRect().height):null,bottomHeight:nav&&visible(nav)?Math.round(nav.getBoundingClientRect().height):0};};
const frame=document.querySelector('#site'),progress=document.querySelector('#progress'),results=document.querySelector('#results');
document.querySelector('#theme').onclick=()=>{const root=frame.contentDocument.documentElement;root.dataset.theme=root.dataset.theme==='dark'?'light':'dark'};
document.querySelector('#measure').onclick=async()=>{const rows=[],d=frame.contentDocument;for(const theme of ['light','dark']){d.documentElement.dataset.theme=theme;await new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)));rows.push(measure(d.documentElement))}results.textContent=JSON.stringify(rows);progress.textContent='Fertig: '+rows.length+' Einzelmessungen';};const loadPage=(p,width)=>new Promise((resolve,reject)=>{frame.style.width=width+'px';const timer=setTimeout(()=>reject(new Error('Zeitüberschreitung '+p)),20000);frame.onload=async()=>{clearTimeout(timer);try{await frame.contentDocument.fonts.ready;await new Promise(r=>setTimeout(r,120));resolve(frame.contentDocument)}catch(e){reject(e)}};frame.src=p;});
document.querySelector('#run').onclick=async()=>{const rows=[];document.querySelector('#run').disabled=true;try{for(const width of [360,390,768,1280])for(const path of paths){progress.textContent=width+' px · '+path;try{const d=await loadPage(path,width);d.querySelectorAll('dialog[open]').forEach(x=>x.close());for(const theme of ['light','dark']){d.documentElement.dataset.theme=theme;await new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)));rows.push(measure(d.documentElement));}}catch(e){rows.push({path,width,error:String(e)})}results.textContent=JSON.stringify(rows);}progress.textContent='Fertig: '+rows.length+' Messungen';}finally{document.querySelector('#run').disabled=false}};
</script></html>
