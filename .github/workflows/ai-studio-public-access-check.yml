name: AI Studio · Öffentlicher Zugriffstest
on:
  workflow_dispatch:
  push:
    paths:
      - '_navigator/worker/index.ts'
      - '_navigator/wrangler.json'
      - '.github/workflows/ai-studio-public-access-check.yml'
permissions:
  contents: read
jobs:
  anonymous-access:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Unangemeldeten Produktionszugriff prüfen
        shell: bash
        run: |
          set -euo pipefail
          URL="https://laneswitch.online/navigator/ai-studio"
          status=$(curl --silent --show-error --max-time 25 --output /tmp/ai-studio-anon-body --dump-header /tmp/ai-studio-anon-headers --write-out "%{http_code}" --max-redirs 0 "$URL")
          echo "Anonymous AI Studio HTTP status: $status"
          test "$status" = "302"
          location=$(grep -i '^location:' /tmp/ai-studio-anon-headers | head -1 | cut -d: -f2- | tr -d '\r' | xargs)
          echo "Anonymous redirect: $location"
          case "$location" in
            /navigator/zugang?next=ai-studio|https://laneswitch.online/navigator/zugang?next=ai-studio) ;;
            *) echo "ERROR: Redirect target is unexpected"; exit 1;;
          esac
          if grep -Eiq 'PRODUKTION AKTIV|VERBINDLICHE.*MARKENAKTE|function contentPrompt' /tmp/ai-studio-anon-body; then
            echo "ERROR: Protected studio content leaked to anonymous visitor"
            exit 1
          fi
          direct=$(curl --silent --show-error --max-time 25 --output /dev/null --write-out "%{http_code}" --max-redirs 0 "https://laneswitch.online/navigator/app.html")
          echo "Direct app shell HTTP status: $direct"
          test "$direct" = "404"
          api=$(curl --silent --show-error --max-time 25 --output /dev/null --write-out "%{http_code}" --max-redirs 0 "https://laneswitch.online/api/navigator?action=me")
          echo "Unauthenticated navigator API HTTP status: $api"
          test "$api" = "401"
          echo "PASS: Studio redirects without login; app shell and private API denied"
          public=$(curl --silent --show-error --max-time 25 --output /tmp/ai-studio-demo-html --write-out "%{http_code}" --max-redirs 0 "https://laneswitch.online/ai-studio/demo/")
          echo "Public AI Studio demo HTTP status: $public"
          test "$public" = "200"
          grep -Fq 'Der echte Ablauf' /tmp/ai-studio-demo-html
          grep -Fq 'MUSTERFAHRSCHULE' /tmp/ai-studio-demo-html
          if grep -Eiq 'function contentPrompt|VERBINDLICHE, BEREINIGTE MARKENAKTE|PRODUKTION AKTIV' /tmp/ai-studio-demo-html; then
            echo "ERROR: Internal AI Studio instructions surfaced on public demo"
            exit 1
          fi
          echo "PASS: public read-only demo accessible; protected studio still requires login"

