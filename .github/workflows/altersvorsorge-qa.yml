name: Altersvorsorge calculation and browser QA
on:
  push:
    branches: [feature/altersvorsorge-2027]
  pull_request:
    branches: [main]
    paths: ['assets/altersvorsorge/**', 'altersvorsorge/**', 'tests/altersvorsorge*', 'scripts/sync-altersvorsorge-online.mjs', '.github/workflows/altersvorsorge-qa.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Mathematical fixtures
        run: node --test tests/altersvorsorge.test.mjs
      - name: Install isolated browser tools
        run: |
          npm install --prefix /tmp/av-browser playwright --fetch-timeout=60000 --fetch-retries=1
          google-chrome --version
      - name: Check online integration
        uses: actions/checkout@v4
        with:
          ref: cloudflare-online
          path: online-target
      # Compare against the live .online branch. Calculation and form logic must be identical;
      # calculator.css is intentionally different because .online has its own design.
      - name: Verify identical calculation and form logic
        run: |
          for f in rules.mjs engine.mjs ui.mjs share.mjs; do cmp "assets/altersvorsorge/$f" "online-target/dist/konzept/assets/altersvorsorge/$f"; done
      - name: Verify privacy notice covers the calculator on both sites
        run: |
          for f in datenschutz/index.html online-target/dist/konzept/datenschutz/index.html; do
            grep -q 'Förderrechner für Altersvorsorge' "$f"
            grep -q 'Rufnummer' "$f"
            grep -q 'sendet sie nicht an einen Server' "$f"
          done
      - name: Browser checks for both sites
        env:
          CODEX_PRIMARY_RUNTIME_NODE_MODULES: /tmp/av-browser/node_modules
          AV_CHROME: /usr/bin/google-chrome
        run: |
          mkdir -p /tmp/av-shots
          python3 -m http.server 8080 > /tmp/de-server.log 2>&1 &
          python3 -m http.server 8081 --directory online-target/dist > /tmp/online-server.log 2>&1 &
          run_check() { if ! "$@" > /tmp/av-check.log 2>&1; then echo "::error title=Browser-Test $AV_LABEL::$(grep -v '^LAYOUT' /tmp/av-check.log | grep -E 'Error|Overflow|LAYOUT|right' | head -c 1500 | tr '\n' ' ')"; grep -A8 '^LAYOUT' /tmp/av-check.log | grep -B3 -A5 "tag:" | head -40; exit 1; fi; }
          AV_LABEL=de run_check node tests/altersvorsorge-browser.cjs
          AV_LABEL=online AV_BASE=http://localhost:8081 AV_ONLINE=1 run_check node tests/altersvorsorge-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: altersvorsorge-browser-screenshots
          path: /tmp/av-shots/
