name: Fahrzeugdaten Probe
on:
  push:
    branches: [claude/fahrzeugdaten-probe]
    paths: ['tools/fahrzeugdaten/probe.mjs']
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node tools/fahrzeugdaten/probe.mjs
      - run: |
          git config user.name "github-actions[bot]"; git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add tools/fahrzeugdaten/probe-out.txt tools/fahrzeugdaten/raw && git commit -m "probe output" && git push
