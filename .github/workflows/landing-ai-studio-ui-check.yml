name: Landingpage · AI-Studio-Kachel prüfen
# Regression: existing benefits, themes and mobile layout
on:
  pull_request:
    branches: [main]
    paths: ['index.html', '.github/workflows/landing-ai-studio-ui-check.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preview-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Browser-Test vorbereiten
        run: npm install --prefix /tmp/landing-browser --no-audit --no-fund playwright-core@1.57.0
      - name: Neue Kachel, Theme, Layout und bestehende Funktionen prüfen
        run: |
          node <<'EOF'
          const {chromium}=require('/tmp/landing-browser/node_modules/playwright-core');
          const assert=require('node:assert/strict'),{execSync}=require('node:child_process');
          const browserPath=execSync('command -v google-chrome || command -v chromium || command -v chromium-browser',{encoding:'utf8'}).trim();
          (async()=>{
            const browser=await chromium.launch({headless:true,executablePath:browserPath,args:['--no-sandbox']});
            try{
              for(const width of [390,1280]){
                const context=await browser.newContext({viewport:{width,height:870},deviceScaleFactor:1});
                const page=await context.newPage(),errors=[];
                page.on('pageerror',e=>errors.push(e.message));
                await page.goto('file://'+process.cwd()+'/index.html',{waitUntil:'domcontentloaded'});
                assert.equal(await page.locator('#vorteile .benefit').count(),7);
                const tile=page.locator('#vorteile .benefit-link');
                assert.equal(await tile.count(),1);
                assert.equal(await tile.getAttribute('href'),'https://laneswitch.online/navigator/ai-studio');
                assert.match(await tile.textContent(),/LANESWITCH AI Studio/);
                assert.equal(await page.locator('#theme').count(),1);
                for(const theme of ['light','dark']){
                  if(await page.locator('html').getAttribute('data-theme')!==theme)await page.locator('#theme').click();
                  assert.equal(await page.locator('html').getAttribute('data-theme'),theme);
                  const paint=await tile.evaluate(x=>({color:getComputedStyle(x).color,bg:getComputedStyle(x).backgroundColor}));
                  assert.ok(paint.color!=='rgba(0, 0, 0, 0)');
                  assert.ok(paint.bg!=='rgba(0, 0, 0, 0)');
                  const overflow=await page.evaluate(()=>document.documentElement.scrollWidth-innerWidth);
                  assert.ok(overflow<=3,`${width}px ${theme}: horizontal overflow ${overflow}`);
                  await page.screenshot({path:`landing-${width}-${theme}.png`,fullPage:true,animations:'disabled'});
                }
                assert.deepEqual(errors,[]);
                await context.close();
              }
            }finally{await browser.close()}
            console.log('PASS: 2 widths × 2 themes, tile link, no horizontal overflow, no JS errors');
          })().catch(e=>{console.error(e);process.exitCode=1});
          EOF
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ai-studio-landing-screenshots
          path: landing-*.png
          if-no-files-found: ignore
